server:
  port: 8088

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: author-service
          uri: lb://author-service
          predicates:
            - Path=/author/**
        - id: price-function-service
          uri: lb://price-function-service
          predicates:
            - Path=/price/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

