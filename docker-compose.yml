version: "3.9"

services:
  mysql:
    image: mysql:8.1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ebookstore1
      MYSQL_USER: ebookuser
      MYSQL_PASSWORD: ebookpass
    ports:
      - "3307:3306"
    volumes:
      - D:/web/newebookstore/hw12/mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ebookstore1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ebookuser
      SPRING_DATASOURCE_PASSWORD: ebookpass
      MYSQL_HOST: mysql
      MYSQL_USER: ebookuser
      MYSQL_PASSWORD: ebookpass
    depends_on:
      mysql:
        condition: service_healthy
